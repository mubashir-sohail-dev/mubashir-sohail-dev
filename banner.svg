<svg width="100%" height="100%" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glowing Mesh Gradients -->
    <radialGradient id="glow-violet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-pink" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.5px;
    }
    .desc-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    .pill {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Card Background with Rounded Corners -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Mesh Glow Layers -->
  <rect width="1200" height="320" rx="16" fill="url(#glow-violet)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow-pink)" />

  <!-- Subtle Perspective Tech Grid -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1050" y1="0" x2="1050" y2="320" />
  </g>

  <!-- Bottom Dynamic Waves (Hardcoded Crisp Paths) -->
  <path d="M0 250 C 300 310, 480 210, 750 270 C 950 310, 1100 240, 1200 260 L 1200 320 L 0 320 Z" fill="url(#wave-grad-2)" />
  <path d="M0 275 C 250 230, 450 310, 700 250 C 920 200, 1080 290, 1200 275 L 1200 320 L 0 320 Z" fill="url(#wave-grad-1)" />

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Top Pill / Status Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(165, 180, 252, 0.3)" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="-98" y="5" class="badge-text" fill="#a5b4fc">AI &amp; MACHINE LEARNING ENGINEER</text>
  </g>

  <!-- Main Headline Name -->
  <text x="600" y="140" text-anchor="middle" class="title-text" fill="url(#title-grad)" filter="url(#shadow)">MUBASHIR SOHAIL</text>

  <!-- Subtitle Tagline -->
  <text x="600" y="185" text-anchor="middle" class="desc-text">
    Architecting Production RAG Systems • Autonomous Agents • Full-Stack AI
  </text>

  <!-- Interactive Tech Pill Badges -->
  <g transform="translate(600, 226)">
    <!-- Pill 1: Zero-Hallucination RAG -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="0" y="4" text-anchor="middle" class="pill">⚡ Dense RAG</text>
    </g>
    <!-- Pill 2: Multi-Platform (FastAPI + Next.js + Flutter) -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="-13" width="240" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="0" y="4" text-anchor="middle" class="pill">🛠️ Next.js • FastAPI • Flutter</text>
    </g>
    <!-- Pill 3: Vector Databases -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="0" y="4" text-anchor="middle" class="pill">🔍 Qdrant &amp; Groq</text>
    </g>
  </g>
</svg>
